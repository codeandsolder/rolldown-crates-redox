name: Strict Rust

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@cb9083676196a8ec3bf013e7253907b2759020c7 # main
    with:
      cargo-args: "--locked --workspace --lib --all-features"

  tests:
    name: Native nightly tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@9c14ef2d72423958c56944febc620ec50f01d65a # main
    with:
      runner: ubuntu-26.04
      command: cargo test --locked --workspace --all-features

  merge-gate:
    name: Rust CI merge gate
    if: ${{ always() }}
    needs: [strict-rust, tests]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@9c14ef2d72423958c56944febc620ec50f01d65a # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["strict-rust","success"],["tests","success"]]
