name: Strict Rust

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      cargo-args: "--locked --workspace --lib --all-features"

  tests:
    name: Native nightly tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@7df510a2053e220c010c331b5daef81a593a19bb # main
    with:
      runner: ubuntu-26.04
      command: cargo test --locked --workspace --all-features

  merge-gate:
    name: Rust CI merge gate
    if: ${{ always() }}
    needs: [strict-rust, tests]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@343303848026ed142e48a6a82e7a889080b99b26 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["strict-rust","success"],["tests","success"]]
