[package]
name = "string_wizard"
version = "1.2.12-fast.0"
edition = "2024"
license = "MIT"
publish = false
description = "Focused fork of Rolldown string_wizard"

[dependencies]
memchr = "2.8.2"
oxc_index = { version = "5", features = ["rayon", "serde"] }
oxc_sourcemap = { version = "9.0.0", optional = true }
regex = { version = "1.13.0", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.228", features = ["derive"], optional = true }

[dev-dependencies]
insta = "1.48.0"

[features]
default = ["sourcemap", "serde"]
serde = ["dep:serde", "oxc_index/serde"]
sourcemap = ["dep:oxc_sourcemap"]
