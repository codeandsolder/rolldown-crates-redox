[package]
name = "rolldown_redox"
version = "0.1.0"
description = "Focused reusable Rolldown-derived ECMAScript and source-map utilities"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["sourcemap"]
sourcemap = ["dep:memchr", "dep:oxc_sourcemap"]
ecmascript = [
  "dep:oxc_allocator",
  "dep:oxc_ast",
  "dep:oxc_parser",
  "dep:oxc_span",
  "dep:oxc_syntax",
  "dep:self_cell",
]

[dependencies]
memchr = { version = "2.8.2", optional = true }
oxc_sourcemap = { version = "9.0.0", optional = true }
oxc_allocator = { version = "0.153.0", optional = true }
oxc_ast = { version = "0.153.0", optional = true }
oxc_parser = { version = "0.153.0", optional = true }
oxc_span = { version = "0.153.0", optional = true }
oxc_syntax = { version = "0.153.0", optional = true }
self_cell = { version = "1.2.1", optional = true }

[dev-dependencies]
serde_json = "1.0.145"
