[package]
name = "string_wizard"
version = "1.2.12-redox.1"
edition.workspace = true
license.workspace = true
publish = false
description = "Focused fork of Rolldown string_wizard with lightweight indices and transactional edits"
repository.workspace = true
rust-version.workspace = true

[dependencies]
memchr = "2.8.2"
oxc_sourcemap = { version = "9.0.0", optional = true }
regex = { version = "1.13.0", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
rustc-hash = "2.1.3"

[dev-dependencies]
insta = "1.48.0"

[features]
default = ["sourcemap"]
# Compatibility with upstream's feature name; the fork no longer needs serde internally.
serde = []
sourcemap = ["dep:oxc_sourcemap"]

[lints]
workspace = true

[[test]]
name = "magic_string_replace"
path = "tests/magic_string_replace.rs"
required-features = ["sourcemap"]

[[test]]
name = "magic_string_source_map"
path = "tests/magic_string_source_map.rs"
required-features = ["sourcemap"]
